name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（纯逻辑层）
        run: ./gradlew --no-daemon testDebugUnitTest

      # 对外发的是 **release 变体**：没有 debuggable，也没有 debug 清单里那个 exported 的调试广播
      # （debug 变体两者都有 —— 本机任意 App 发一条广播就能触发判读/截屏）。
      # 签名走 build.gradle.kts 的兜底：CI 里没有 keystore.properties，就用仓库里那把公开的调试签名，
      # 保证产物**装得上**、并且和以前的 debug 版是同一把钥匙（老用户还能覆盖升级）。
      - name: 打包 APK
        run: ./gradlew --no-daemon assembleRelease

      - name: 改个能认出来的文件名
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/JevGuide-${GITHUB_REF_NAME}.apk"
          # 再放一份不带版本号的：这样 releases/latest/download/JevGuide.apk 永远是「最新版」直链
          cp app/build/outputs/apk/release/app-release.apk "out/JevGuide.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JevGuide-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 打 tag 时自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
