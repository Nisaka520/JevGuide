name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试（纯逻辑层）
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 打包 APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 改个能认出来的文件名
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/JevGuide-${GITHUB_REF_NAME}-debug.apk"
          # 再放一份不带版本号的：这样 releases/latest/download/JevGuide-debug.apk 永远是「最新版」直链
          cp app/build/outputs/apk/debug/app-debug.apk "out/JevGuide-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: JevGuide-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 打 tag 时自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
